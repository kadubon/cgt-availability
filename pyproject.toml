[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cgt-availability"
version = "0.1.0"
description = "Finite diagnostic library for scientific availability of CGT claim packages."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "cgt-availability contributors" }
]
keywords = [
  "constraint-generative-theory",
  "scientific-availability",
  "scientific-claim-diagnostics",
  "claim-package",
  "deficiency-profile",
  "effect-profile",
  "report-projection",
  "diagnostics",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
schema = [
  "jsonschema>=4.25",
]
fast = [
  "msgspec>=0.19",
]
graph = [
  "networkx>=3.4",
]
modelcheck = [
  "networkx>=3.4",
]
stats = [
  "scipy>=1.14",
]
opt = [
  "ortools>=9.14",
]
adapters = [
  "pydantic>=2.12",
]
test = [
  "hypothesis>=6.148",
]
research = [
  "networkx>=3.4",
  "scipy>=1.14",
]
experiments = [
  "pandas>=2.3",
  "matplotlib>=3.10",
  "scipy>=1.14",
  "jsonschema>=4.25",
]

[project.urls]
Homepage = "https://github.com/kadubon/cgt-availability"
Repository = "https://github.com/kadubon/cgt-availability"
Issues = "https://github.com/kadubon/cgt-availability/issues"
DOI = "https://doi.org/10.5281/zenodo.20262492"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cgt_availability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["cgt_availability"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
